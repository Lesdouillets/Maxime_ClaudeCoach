name: Deploy Staging (stg2)

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deploy-gh-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          NEXT_PUBLIC_STRAVA_REDIRECT_URI: ${{ secrets.STRAVA_REDIRECT_URI }}
          NEXT_PUBLIC_STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          NEXT_PUBLIC_BASE_PATH: /Maxime_ClaudeCoach/stg2
          NEXT_PUBLIC_SUPABASE_URL: https://oogyxvjawdcarsfvinjg.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          NEXT_PUBLIC_ENV: staging

      - name: Deploy to GitHub Pages (stg2 subfolder)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          target-folder: stg2
          clean: true

  deploy-functions:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy analyze-session edge function
        run: supabase functions deploy analyze-session --project-ref oogyxvjawdcarsfvinjg --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy chat-coach edge function
        run: supabase functions deploy chat-coach --project-ref oogyxvjawdcarsfvinjg --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
