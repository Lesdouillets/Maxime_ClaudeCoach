# Tests des fonctions edge, à chaque pull request et sur main.
#
# Le déploiement n'attend pas ces tests — il part sur `push: main`, en parallèle.
# Le but ici est d'attraper une régression dans la construction des prompts
# avant qu'elle ne parte en production, pas de bloquer une chaîne qui existe
# déjà.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-functions:
    name: Tests des fonctions edge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `--node-modules-dir=auto` : le dépôt porte un package.json Next.js, donc
      # Deno attend un node_modules déjà installé pour résoudre les spécificateurs
      # `npm:`. Sur un runner neuf il n'y en a pas — on le laisse gérer le sien.
      - name: Typage
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

      - name: Tests
        run: deno test --node-modules-dir=auto supabase/functions/
